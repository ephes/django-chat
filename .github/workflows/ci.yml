name: CI

# Same checks as `just check` (lint, format check, typecheck, tests) plus a
# pip-audit of the locked dependencies. Test settings use in-memory SQLite and
# local file storage, so no database service and no secrets are needed.
# Browser tests stay skipped (they need DJANGO_CHAT_BROWSER_TESTS=1).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'supersedable' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHONUNBUFFERED: "1"
  UV_NO_PROGRESS: "1"
  # requires-python is >=3.14.4,<3.15; production runs 3.14.
  UV_PYTHON: "3.14"

jobs:
  check:
    name: Lint, typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Lint (just lint)
        run: uv run --locked ruff check .
      - name: Format check (just format-check)
        run: uv run --locked ruff format --check .
      - name: Typecheck (just typecheck)
        run: uv run --locked ty check config django_chat manage.py
      - name: Tests (just test)
        run: uv run --locked pytest

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: uv.lock
      # django-cast is a git dependency and cannot be audited by version; pip-audit
      # reports it as skipped. Everything else is checked against the lock.
      - name: Audit locked dependencies
        run: |
          uv export --locked --no-hashes --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" --disable-pip --no-deps
