---
django_chat_environment: staging
django_chat_wagtail_fqdn: djangochat.staging.django-cast.com
django_chat_traefik_host_rule: "Host(`{{ django_chat_wagtail_fqdn }}`)"
django_chat_django_allowed_hosts: "{{ django_chat_wagtail_fqdn }},localhost"
django_chat_cast_comments_enabled: true
django_chat_cast_voxhelm_known_speaker_enabled: true
django_chat_disable_transcript_cache: true

wagtail_fqdn: "{{ django_chat_wagtail_fqdn }}"
wagtail_traefik_host_rule: "{{ django_chat_traefik_host_rule }}"
wagtail_app_port: 10015

# The staging host is shared and managed by ops-control, which tracks the
# latest uv in /usr/local/bin. Pinning an older version here would downgrade
# that shared binary on every deploy (and re-download the installer).
uv_version: "latest"
